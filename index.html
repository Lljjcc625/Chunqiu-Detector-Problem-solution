  <script>
    (function () {
      'use strict';

      /* 仅索引「词条标题」：Markdown 的 ##/### 标题 与 <summary> 文本。
         条目解释正文（<details> 内部内容）不进入索引，也不参与匹配。 */
      var DOCS = {
        zh: { path: 'language/answer_zh.md', placeholder: '搜索词条...', empty: '未找到相关词条', entry: '检测项' },
        en: { path: 'language/answer_en.md', placeholder: 'Search entries...', empty: 'No matching entry', entry: 'Detected item' }
      };
      var SECTION_LABEL = { zh: '分类', en: 'Section' };
      var MAX_RESULTS = 40;

      var cache = {};
      var pending = {};
      var lastQuery = '';
      var renderSeq = 0;
      var navInput = null;
      var navPanel = null;
      var sideInput = null;
      var sidePanel = null;

      function lang() {
        return /answer_en/.test(window.location.hash) ? 'en' : 'zh';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function plain(s) {
        return String(s)
          .replace(/<[^>]*>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
          .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
          .replace(/&nbsp;/g, ' ')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/\s+/g, ' ')
          .trim();
      }

      function parseIndex(md) {
        var items = [];
        var section = '';
        var entryIndex = 0;
        var headIndex = 0;
        var inFence = false;
        var lines = md.split(/\r?\n/);

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();

          if (/^(```|~~~)/.test(line)) { inFence = !inFence; continue; }
          if (inFence || !line) continue;

          var h = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
          if (h) {
            var level = h[1].length;
            var heading = plain(h[2]);
            section = heading;
            if ((level === 2 || level === 3) && heading) {
              items.push({ kind: 'heading', title: heading, section: heading, index: headIndex++ });
            }
            continue;
          }

          var re = /<summary\b[^>]*>([\s\S]*?)<\/summary>/gi;
          var m;
          while ((m = re.exec(line)) !== null) {
            var title = plain(m[1]);
            if (title) items.push({ kind: 'entry', title: title, section: section, index: entryIndex++ });
          }
        }
        return items;
      }

      function loadIndex(l) {
        if (cache[l]) return Promise.resolve(cache[l]);
        if (pending[l]) return pending[l];
        pending[l] = fetch(DOCS[l].path, { cache: 'no-cache' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (md) {
            cache[l] = parseIndex(md);
            return cache[l];
          })
          .catch(function (err) {
            console.warn('[entry-search] 索引加载失败 / index failed:', err);
            cache[l] = [];
            return cache[l];
          });
        return pending[l];
      }

      /* 只比对标题：多关键词用空格分隔，全部命中才算匹配 */
      function search(items, query) {
        var q = plain(query).toLowerCase();
        if (!q) return [];
        var tokens = q.split(/\s+/).filter(Boolean);
        var hits = [];

        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var title = item.title.toLowerCase();
          var matched = true;
          for (var j = 0; j < tokens.length; j++) {
            if (title.indexOf(tokens[j]) === -1) { matched = false; break; }
          }
          if (!matched) continue;
          var score = title === q ? 0 : (title.indexOf(q) === 0 ? 1 : (title.indexOf(q) > 0 ? 2 : 3));
          hits.push({ item: item, score: score });
        }

        hits.sort(function (a, b) {
          if (a.score !== b.score) return a.score - b.score;
          if (a.item.kind !== b.item.kind) return a.item.kind === 'entry' ? -1 : 1;
          if (a.item.title.length !== b.item.title.length) return a.item.title.length - b.item.title.length;
          return a.item.title.localeCompare(b.item.title);
        });

        return hits.slice(0, MAX_RESULTS).map(function (hit) { return hit.item; });
      }

      function highlight(title, query) {
        var tokens = plain(query).toLowerCase().split(/\s+/).filter(Boolean);
        var lower = title.toLowerCase();
        var ranges = [];

        tokens.forEach(function (token) {
          var from = 0;
          while (from <= lower.length) {
            var at = lower.indexOf(token, from);
            if (at === -1) break;
            ranges.push([at, at + token.length]);
            from = at + token.length;
          }
        });
        if (!ranges.length) return escapeHtml(title);

        ranges.sort(function (a, b) { return a[0] - b[0] || b[1] - a[1]; });
        var merged = [];
        ranges.forEach(function (range) {
          var prev = merged[merged.length - 1];
          if (prev && range[0] <= prev[1]) prev[1] = Math.max(prev[1], range[1]);
          else merged.push([range[0], range[1]]);
        });

        var html = '';
        var pos = 0;
        merged.forEach(function (range) {
          html += escapeHtml(title.slice(pos, range[0]));
          html += '<span class="search-keyword">' + escapeHtml(title.slice(range[0], range[1])) + '</span>';
          pos = range[1];
        });
        html += escapeHtml(title.slice(pos));
        return html;
      }

      function renderResults(results, query, l) {
        if (!results.length) {
          return '<div class="no-results">' + escapeHtml(DOCS[l].empty) + '</div>';
        }
        return results.map(function (item) {
          var attr = item.kind === 'entry'
            ? 'data-entry="' + item.index + '"'
            : 'data-head="' + item.index + '"';
          var label = item.kind === 'entry'
            ? (item.section || DOCS[l].entry)
            : SECTION_LABEL[l];
          return '<a class="matching-post" href="javascript:void(0)" ' + attr +
            ' data-title="' + escapeHtml(item.title) + '">' +
            '<h2>' + highlight(item.title, query) + '</h2>' +
            '<p>' + escapeHtml(label) + '</p>' +
            '</a>';
        }).join('');
      }

      function hidePanels() {
        var nav = document.querySelector('.nav-search-dropdown');
        var side = document.querySelector('.sidebar .results-panel');
        if (nav) nav.classList.remove('show');
        if (side) side.classList.remove('show');
      }

      function apply(query) {
        lastQuery = query;
        var l = lang();
        var seq = ++renderSeq;

        if (!query.trim()) {
          hidePanels();
          return;
        }

        loadIndex(l).then(function (items) {
          if (seq !== renderSeq) return;
          var results = search(items, query);
          var html = renderResults(results, query, l);

          var nav = document.querySelector('.nav-search-dropdown');
          var side = document.querySelector('.sidebar .results-panel');
          if (nav) { nav.innerHTML = html; nav.classList.add('show'); }
          if (side) { side.innerHTML = html; side.classList.add('show'); }
        });
      }

      function summaryText(details) {
        var summary = details.querySelector('summary');
        return summary ? plain(summary.textContent) : '';
      }

      function reveal(el) {
        if (el.tagName === 'DETAILS') el.open = true;
        /* block:'start' + scroll-margin-top 让展开后的条目标题停在视口顶部附近 */
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.remove('search-highlight');
        void el.offsetWidth;
        el.classList.add('search-highlight');
        window.setTimeout(function () { el.classList.remove('search-highlight'); }, 2400);
      }

      function findEntry(index, title) {
        var list = Array.prototype.slice.call(document.querySelectorAll('.markdown-section details'));
        var byIndex = list[index];
        if (byIndex && summaryText(byIndex) === title) return byIndex;
        for (var i = 0; i < list.length; i++) {
          if (summaryText(list[i]) === title) return list[i];
        }
        return null;
      }

      function openEntry(index, title, attempt) {
        attempt = attempt || 0;
        var target = findEntry(index, title);
        if (target) { reveal(target); return; }

        if (attempt === 0) {
          /* 不在当前文档（例如停留在致谢页）：先跳到词条所属文档 */
          window.location.hash = '#/' + DOCS[lang()].path;
          window.setTimeout(function () { openEntry(index, title, 1); }, 700);
          return;
        }
        if (attempt < 8) {
          window.setTimeout(function () { openEntry(index, title, attempt + 1); }, 450);
        }
      }

      function openHeading(index, title) {
        var heads = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h2, .markdown-section h3'));
        var target = heads[index];
        if (!target || plain(target.textContent) !== title) {
          target = null;
          var all = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3'));
          for (var i = 0; i < all.length; i++) {
            if (plain(all[i].textContent) === title) { target = all[i]; break; }
          }
        }
        if (target) reveal(target);
      }

      function bindInput(input) {
        input.addEventListener('input', function () {
          var value = input.value;
          if (navInput && navInput !== input) navInput.value = value;
          if (sideInput && sideInput !== input) sideInput.value = value;
          apply(value);
        });

        input.addEventListener('focus', function () {
          if (input.value.trim()) apply(input.value);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            var panel = (input === sideInput)
              ? document.querySelector('.sidebar .results-panel')
              : document.querySelector('.nav-search-dropdown');
            var first = panel && panel.querySelector('.matching-post');
            if (first) first.click();
          } else if (e.key === 'Escape') {
            hidePanels();
            input.blur();
          }
        });
      }

      function ensureNavSearch() {
        var navUl = document.querySelector('.app-nav ul');
        if (!navUl) return;

        var li = navUl.querySelector('.nav-search-item');
        if (!li) {
          li = document.createElement('li');
          li.className = 'nav-search-item';

          navInput = document.createElement('input');
          navInput.type = 'search';
          navInput.className = 'nav-search-input';
          navInput.setAttribute('aria-label', 'Search entries');

          navPanel = document.createElement('div');
          navPanel.className = 'nav-search-dropdown';

          li.appendChild(navInput);
          li.appendChild(navPanel);
          bindInput(navInput);
        } else {
          navInput = li.querySelector('.nav-search-input');
          navPanel = li.querySelector('.nav-search-dropdown');
        }

        if (navUl.firstChild !== li) navUl.insertBefore(li, navUl.firstChild);
        if (navInput) navInput.placeholder = DOCS[lang()].placeholder;
      }

      function ensureSidebarSearch() {
        var sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;

        var wrap = sidebar.querySelector('.search');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.className = 'search';

          sideInput = document.createElement('input');
          sideInput.type = 'search';
          sideInput.className = 'search-input';
          sideInput.setAttribute('aria-label', 'Search entries');

          sidePanel = document.createElement('div');
          sidePanel.className = 'results-panel';

          wrap.appendChild(sideInput);
          wrap.appendChild(sidePanel);

          var sidebarNav = sidebar.querySelector('.sidebar-nav');
          if (sidebarNav) sidebar.insertBefore(wrap, sidebarNav);
          else sidebar.appendChild(wrap);

          bindInput(sideInput);
        } else {
          sideInput = wrap.querySelector('input');
          sidePanel = wrap.querySelector('.results-panel');
        }

        if (sideInput) sideInput.placeholder = DOCS[lang()].placeholder;
      }

      /* 点击结果：只展开被点击的那一个词条 */
      document.addEventListener('click', function (e) {
        var hit = e.target.closest('.matching-post[data-entry], .matching-post[data-head]');
        if (hit) {
          e.preventDefault();
          var title = hit.getAttribute('data-title') || '';
          hidePanels();
          if (hit.hasAttribute('data-entry')) {
            openEntry(parseInt(hit.getAttribute('data-entry'), 10), title);
          } else {
            openHeading(parseInt(hit.getAttribute('data-head'), 10), title);
          }
          return;
        }

        var navWrap = document.querySelector('.nav-search-item');
        if (navWrap && !navWrap.contains(e.target)) {
          var nav = document.querySelector('.nav-search-dropdown');
          if (nav) nav.classList.remove('show');
        }
        var sideWrap = document.querySelector('.sidebar .search');
        if (sideWrap && !sideWrap.contains(e.target)) {
          var side = document.querySelector('.sidebar .results-panel');
          if (side) side.classList.remove('show');
        }
      }, true);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hidePanels();
      });

      /* 路由切换：清空查询，重新挂载搜索框 */
      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
          lastQuery = '';
          renderSeq++;
          if (navInput) navInput.value = '';
          if (sideInput) sideInput.value = '';
          hidePanels();
          ensureNavSearch();
          ensureSidebarSearch();
          loadIndex(lang());
        });
      });

      /* 导航栏会随路由重建，定期确保搜索框存在 */
      window.setInterval(function () {
        ensureNavSearch();
        ensureSidebarSearch();
      }, 400);
    })();
  </script>
</body>
</html>
